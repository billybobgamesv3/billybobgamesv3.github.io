<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fix Selector</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui;
      background: linear-gradient(135deg, #0f172a, #020617);
      color: #e5e7eb;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* MAIN CONTAINER */
    .app {
      width: 100%;
      max-width: 900px;
      padding: 40px;
      border-radius: 20px;
      background: rgba(255,255,255,0.03);
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }

    /* TITLE */
    .title {
      font-size: 2.4rem;
      font-weight: 600;
      margin-bottom: 30px;
      letter-spacing: -0.5px;
    }

    /* BUTTON ROW */
    .actions {
      display: flex;
      gap: 16px;
    }

    /* PRIMARY BUTTON */
    .btn-primary {
      background: #2563eb;
      border: none;
      padding: 14px 28px;
      border-radius: 10px;
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
    }

    /* SECONDARY LINK */
    .btn-secondary {
      display: flex;
      align-items: center;
      padding: 14px 20px;
      border-radius: 10px;
      background: rgba(255,255,255,0.05);
      text-decoration: none;
      color: #9ca3af;
      transition: all 0.2s ease;
    }

    .btn-secondary:hover {
      background: rgba(255,255,255,0.1);
      color: white;
    }

    /* SUBTEXT */
    .subtext {
      margin-top: 20px;
      font-size: 0.85rem;
      color: #6b7280;
    }

    /* PASSWORD SCREEN */
    #passwordScreen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #020617, #000);
    }

    .password-box {
      background: rgba(255,255,255,0.04);
      padding: 30px;
      border-radius: 16px;
      width: 280px;
      text-align: center;
      backdrop-filter: blur(20px);
    }

    .password-box h2 {
      margin-bottom: 20px;
      font-weight: 500;
    }

    .password-box input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.1);
      background: transparent;
      color: white;
      outline: none;
    }

    .password-box button {
      margin-top: 12px;
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }

    #error {
      margin-top: 10px;
      font-size: 0.8rem;
      color: #9ca3af;
      display: none;
    }
  </style>
</head>

<body>

<div id="passwordScreen">
  <div class="password-box">
    <h2>Enter Password</h2>
    <input type="password" id="passwordInput" placeholder="Password" />
    <button onclick="checkPassword()">Enter</button>
    <p id="error">Incorrect password</p>
  </div>
</div>

<div id="realContent" style="display:none;">
  <div class="app">
    <div class="title">Fix Selector</div>

    <div class="actions">
      <button id="bypass-button" class="btn-primary">Fix</button>
      <a href="site" class="btn-secondary">No Fix</a>
    </div>

    <div id="random-text" class="subtext"></div>
  </div>
</div>

<script>
  const bypassBtn = document.getElementById('bypass-button');

  bypassBtn.addEventListener('click', () => {
    const newTab = window.open('about:blank');
    if (!newTab) {
      alert("Pop-up blocked!");
      return;
    }

    window.location.href = 'https://classroom.google.com';

    const iframe = newTab.document.createElement('iframe');
    iframe.src = 'site';
    iframe.style.width = '100vw';
    iframe.style.height = '100vh';
    iframe.style.border = 'none';

    newTab.document.body.style.margin = '0';
    newTab.document.body.appendChild(iframe);
  });

  document.getElementById("passwordInput").addEventListener("keydown", function(e) {
    if (e.key === "Enter") checkPassword();
  });

  const randomTexts = ["We're running it back!"];

  function showRandomText() {
    const chosen = randomTexts[Math.floor(Math.random() * randomTexts.length)];
    document.getElementById("random-text").textContent = chosen;
  }

  function checkPassword() {
    const input = document.getElementById("passwordInput").value;

    if (input === "lebronjames") {
      document.getElementById("passwordScreen").style.display = "none";
      document.getElementById("realContent").style.display = "block";
      showRandomText();
    } else {
      document.getElementById("error").style.display = "block";
    }
  }
</script>

</body>
</html>
